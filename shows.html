                <!-- Shows will be loaded here -->

        </div>

    <!-- Dynamic Show Loader -->
    <script>
        fetch('assets/data/shows.json')
            .then(res => res.json())
            .then(shows => {
                const container = document.getElementById('shows-container');
                const modalContainer = document.createElement('div');

                // Sort shows by most recent first (descending date order)
                shows.sort((a, b) => new Date(b.date) - new Date(a.date));

                // Group shows by year
                const showsByYear = shows.reduce((acc, show) => {
                    const year = new Date(show.date).getFullYear();
                    if (!acc[year]) {
                        acc[year] = [];
                    }
                    acc[year].push(show);
                    return acc;
                }, {});

                // Sort the years in descending order
                const sortedYears = Object.keys(showsByYear).sort((a, b) => b - a);

                // Loop through each year and show
                sortedYears.forEach(year => {
                    const yearSection = document.createElement('div');
                    yearSection.className = 'year-section';
                    yearSection.innerHTML = `<h4 class="year-heading">${year}</h4>`;
                    
                    const yearShows = showsByYear[year];

                    yearShows.forEach(show => {
                        // Show List Item in a single line
                        const listItem = document.createElement('a');
                        listItem.className = 'list-group-item list-group-item-action show-item';
                        listItem.setAttribute('data-toggle', 'modal');
                        listItem.setAttribute('href', `#showModal${show.id}`);
                        listItem.innerHTML = `
                            <div class="show-item-details">
                                <span class="show-date">${new Date(show.date).toDateString()}</span> 
                                <span class="show-venue">${show.venue}</span> 
                                <span class="show-location">${show.location}</span>
                            </div>
                        `;
                        yearSection.appendChild(listItem);

                        // Modal
                        const modal = document.createElement('div');
                        modal.className = 'show-modal modal fade';
                        modal.id = `showModal${show.id}`;
                        modal.tabIndex = -1;
                        modal.role = 'dialog';
                        modal.innerHTML = `
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="close-modal" data-dismiss="modal">
                                        <img src="assets/img/close-icon.svg" alt="Close modal" />
                                    </div>
                                    <div class="container">
                                        <div class="row justify-content-center">
                                            <div class="col-lg-8">
                                                <div class="modal-body">
                                                    <h2 class="text-uppercase">${show.venue}</h2>
                                                    <p class="item-intro text-muted">${show.location} - ${new Date(show.date).toDateString()}</p>
                                                    <img class="img-fluid d-block mx-auto" src="${show.image}" alt="${show.venue}" />
                                                    <p>${show.description}</p>
                                                    <ul class="list-inline">
                                                        <li>Date: ${new Date(show.date).toDateString()}</li>
                                                        <li>Location: ${show.location}</li>
                                                    </ul>
                                                    <button class="btn btn-primary" data-dismiss="modal" type="button">
                                                        <i class="fas fa-times mr-1"></i> Close
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                        modalContainer.appendChild(modal);
                    });

                    container.appendChild(yearSection);
                });

                document.body.appendChild(modalContainer);
            })
            .catch(error => {
                console.error('Error loading shows:', error);
            });
    </script>
