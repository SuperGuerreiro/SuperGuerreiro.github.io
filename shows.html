    <!-- Dynamic Show Loader -->
    <script>
        fetch('assets/data/shows.json')
            .then(res => res.json())
            .then(shows => {
                const container = document.getElementById('shows-container');
                const modalContainer = document.createElement('div');
                const today = new Date();
                today.setHours(0, 0, 0, 0); // Ensure clean date comparison

                // Split shows into upcoming and past
                const upcomingShows = shows.filter(show => new Date(show.date) >= today);
                const pastShows = shows.filter(show => new Date(show.date) < today);

                // Helper to group shows by year
                const groupByYear = (showsArray) => {
                    const grouped = showsArray.reduce((acc, show) => {
                        const year = new Date(show.date).getFullYear();
                        if (!acc[year]) acc[year] = [];
                        acc[year].push(show);
                        return acc;
                    }, {});
                    return Object.keys(grouped).sort((a, b) => b - a).map(year => ({
                        year,
                        shows: grouped[year].sort((a, b) => new Date(b.date) - new Date(a.date))
                    }));
                };

                const createShowItem = (show) => {
                    const listItem = document.createElement('a');
                    listItem.className = 'list-group-item list-group-item-action show-item';
                    listItem.setAttribute('data-toggle', 'modal');
                    listItem.setAttribute('href', `#showModal${show.id}`);
                    listItem.innerHTML = `
                        <div class="show-item-details">
                            <span class="show-date">${new Date(show.date).toDateString()}</span> 
                            <span class="show-venue">${show.venue}</span> 
                            <span class="show-location">${show.location}</span>
                        </div>
                    `;
                    return listItem;
                };

                const createShowModal = (show) => {
                    const modal = document.createElement('div');
                    modal.className = 'show-modal modal fade';
                    modal.id = `showModal${show.id}`;
                    modal.tabIndex = -1;
                    modal.role = 'dialog';
                    modal.innerHTML = `
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="close-modal" data-dismiss="modal">
                                    <img src="assets/img/close-icon.svg" alt="Close modal" />
                                </div>
                                <div class="container">
                                    <div class="row justify-content-center">
                                        <div class="col-lg-8">
                                            <div class="modal-body">
                                                <h2 class="text-uppercase">${show.venue}</h2>
                                                <p class="item-intro text-muted">${show.location} - ${new Date(show.date).toDateString()}</p>
                                                <img class="img-fluid d-block mx-auto" src="${show.image}" alt="${show.venue}" />
                                                <p>${show.description}</p>
                                                <ul class="list-inline">
                                                    <li>Date: ${new Date(show.date).toDateString()}</li>
                                                    <li>Location: ${show.location}</li>
                                                </ul>
                                                <button class="btn btn-primary" data-dismiss="modal" type="button">
                                                    <i class="fas fa-times mr-1"></i> Close
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    return modal;
                };

                const renderShowSection = (title, groupedShows) => {
                    const section = document.createElement('div');
                    section.innerHTML = `<h3 class="text-center-shows mb-4">${title}</h3>`;
                    
                    groupedShows.forEach(group => {
                        const yearDiv = document.createElement('div');
                        yearDiv.className = 'year-section';
                        yearDiv.innerHTML = `<h4 class="year-heading">${group.year}</h4>`;

                        const listGroup = document.createElement('div');
                        listGroup.className = 'list-group';

                        group.shows.forEach(show => {
                            const item = createShowItem(show);
                            listGroup.appendChild(item);
                            modalContainer.appendChild(createShowModal(show));
                        });

                        yearDiv.appendChild(listGroup);
                        section.appendChild(yearDiv);
                    });

                    container.appendChild(section);
                };

                // Process and display both sections
                if (upcomingShows.length) {
                    const groupedUpcoming = groupByYear(upcomingShows);
                    renderShowSection('Upcoming Shows', groupedUpcoming);
                }

                if (pastShows.length) {
                    const groupedPast = groupByYear(pastShows);
                    renderShowSection('Past Shows', groupedPast);
                }

                document.body.appendChild(modalContainer);
            })
            .catch(error => {
                console.error('Error loading shows:', error);
            });
    </script>
